services:
  web:
    container_name: adtestpro
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Source bind for local dev (drop for a pure image deploy).
      - .:/app
      # Named volume: settings, preferences, and run history survive rebuilds.
      - adtestpro-data:/data
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ADTESTPRO_DATA_DIR=/data
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    networks:
      - adtestpro-network

networks:
  adtestpro-network:
    name: adtestpro-network

volumes:
  adtestpro-data:
    name: adtestpro-data
